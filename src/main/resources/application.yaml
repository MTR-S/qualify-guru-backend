spring:
  application:
    name: qualify-guru

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:mysql://localhost:3306/qualify_guru
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  jackson:
    property-naming-strategy: SNAKE_CASE

jwt:
  secret: ${JWT_SECRET:VGhpcy1Jcy1BLVRlc3QtU2VjcmV0LUtleS1UaGF0LU11c3QtQmUtQXQtTGVhc3QtMjU2LUJpdHM=}
  expiration: ${JWT_EXPIRATION:86400000}

